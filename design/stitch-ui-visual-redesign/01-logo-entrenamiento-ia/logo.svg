<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182334" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4FF28" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)" stroke="rgba(212, 255, 40, 0.25)" stroke-width="2" />
  <!-- Dynamic kinetic dumbbell icon -->
  <g transform="translate(50, 50) rotate(-45) translate(-50, -50)">
    <!-- Central bar -->
    <rect x="36" y="46" width="28" height="8" rx="4" fill="#FFFFFF" />
    <!-- Center energy grip -->
    <rect x="46" y="44" width="8" height="12" rx="3" fill="#D4FF28" filter="url(#glow)" />
    <!-- Weight plates left -->
    <rect x="26" y="32" width="10" height="36" rx="5" fill="url(#glowGrad)" />
    <rect x="18" y="38" width="8" height="24" rx="4" fill="#00F0FF" opacity="0.8" />
    <!-- Weight plates right -->
    <rect x="64" y="32" width="10" height="36" rx="5" fill="url(#glowGrad)" />
    <rect x="74" y="38" width="8" height="24" rx="4" fill="#00F0FF" opacity="0.8" />
  </g>
  <!-- Cybernetic status dot -->
  <circle cx="78" cy="78" r="6" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="78" cy="78" r="3" fill="#FFFFFF" />
</svg>